---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb"]
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: demo
spec:
  selector: {app: redis}
  ports:
    - {port: 6379}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: load-generator}
  template:
    metadata:
      labels: {app: load-generator}
    spec:
      containers:
        - name: load-generator
          image: novatec-lab-app:v1
          imagePullPolicy: Never
          command: ["python", "-u", "load.py"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
