apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-a
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: app-a}
  template:
    metadata:
      labels: {app: app-a}
    spec:
      containers:
        - name: app-a
          image: novatec-lab-app:v1
          imagePullPolicy: Never
          env:
            - {name: APP_ROLE, value: app-a}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: app-a
  namespace: demo
spec:
  type: NodePort
  selector: {app: app-a}
  ports:
    - {port: 8080, nodePort: 30082}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-b
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: app-b}
  template:
    metadata:
      labels: {app: app-b}
    spec:
      containers:
        - name: app-b
          image: novatec-lab-app:v1
          imagePullPolicy: Never
          env:
            - {name: APP_ROLE, value: app-b}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
